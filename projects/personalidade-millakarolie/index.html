	<head>

		/>
		<meta name="description" content="Um quiz de personalidade para casamentos" />
		<meta name="keywords" content="" />

		<title>Personalidade Milla Karolie</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

	<body>

        <div class="main-container">
            <div class="header-container" id="header">
                <div class="brand-mark">
                    <img src="img/id-transparente.PNG" alt="Identidade Milla Karolie" />
                </div>
                <p class="eyebrow">Quiz de Personalidade</p>
                <h1>Milla Karolie</h1>
            </div>
            <div class="welcome-container" id="welcome">

                <div>
                    <p class="intro-lead">Descubra qual atmosfera combina mais com o seu estilo e com a essência do seu casamento.</p>
                    <div class="name-field">
                        <label for="nome-participante">Seu nome</label>
                        <input
                            type="text"
                            id="nome-participante"
                            name="nome-participante"
                            placeholder="Digite seu nome"
                        />
                    </div>
                    <div class="start" onclick=iniciaJogo()><img src="img/start.png" /></div>
    
    
                </div>
    
            </div>
    
            <div class="game-container hide-block" id="game">
                <div class="question-wrapper">
                    <img src="img/questionMark.png" class="question-mark" />
                    <div class="question-text" id="question-text"></div>
                    <div class="options-wrapper">
                            <div class="option" optionID="A" onclick="selectOption('A');enviarResposta()"></div>
                            <div class="option" optionID="B" onclick="selectOption('B');enviarResposta()"></div>
                            <div class="option" optionID="C" onclick="selectOption('C');enviarResposta()"></div>
                    </div>
                </div>
                
    
            </div>
    
            <div class="finish-container hide-block" id="finish">
                <div>
                    <div class="result-brand">
                        <img class="end-game" src="img/id-transparente.PNG" alt="Identidade Milla Karolie" />
                    </div>
                    <p>Seu resultado foi:</p>
                    <p class="result-title"><b><span id="resultado-titulo"></span></b></p>
                    <div id="resultado-descricao" class="result-description"></div>
                    <div id="tie-breaker" class="tie-breaker hide-block">
                        <p class="tie-breaker-title">Qual dessas personalidades combina mais com você?</p>
                        <div id="tie-breaker-options" class="tie-breaker-options"></div>
                    </div>
                    <p class="result-score" id="resultado-contagem"></p>
                </div>
                <div class="submit-answers">
                    <a id="whatsapp-link" class="submit-button" href="#" target="_blank" rel="noopener noreferrer" onclick="enviarParaWhatsapp(event)">Enviar minhas respostas</a>
                </div>
            </div>

        </div>

		

		



	</body>
